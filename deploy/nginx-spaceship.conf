# spaceship.product1c.ru — статический сайт движка SpaceShip.
# TLS завершает прокси хостинга и шлёт трафик на порт 80 origin.
# Редирект HTTP→HTTPS здесь ставить нельзя: через прокси он зацикливается.
server {
    listen 80;
    listen [::]:80;
    server_name spaceship.product1c.ru;
    root /var/www/spaceship.product1c.ru;
    index index.html;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/plain image/svg+xml;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Строгий CSP: скрипты только свои и three.js с jsDelivr. Инлайн-скриптов в сайте нет.
    # 'unsafe-inline' для стилей нужен: карточки задают --переменные через атрибут style.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Страница и контент меняются часто — кеш не держим
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location ^~ /content/ {
        expires -1;
        try_files $uri =404;
    }
    # Код движка: короткий кеш, после выкладки он обновится через минуту
    location ^~ /src/ {
        expires 1m;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # Служебные файлы не отдаём
    location ~ /\. {
        deny all;
    }
}
